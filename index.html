<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robi Setiawan</title>
  <style>
    :root {
      --bg: #0f1115;
      --text: #f5f5f0;
      --accent: #6ee7b7;
      --muted: #9aa0a6;
      --toggle-bg: #1c1f26;
      --toggle-border: #2a2e37;
    }

    [data-theme="light"] {
      --bg: #f5f5f0;
      --text: #14161a;
      --accent: #059669;
      --muted: #6b7076;
      --toggle-bg: #ffffff;
      --toggle-border: #dcdcd6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--toggle-border);
      background: var(--toggle-bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.06);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .greeting {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
    }

    h1 span {
      color: var(--accent);
    }

    @media (prefers-reduced-motion: no-preference) {
      .greeting, h1 {
        opacity: 0;
        animation: rise 0.6s ease forwards;
      }
      h1 {
        animation-delay: 0.15s;
      }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti mode terang/gelap" title="Ganti mode terang/gelap">
    <span id="themeIcon">🌙</span>
  </button>

  <div>
    <p class="greeting">Hallo</p>
    <h1>My name is <span>Robi</span></h1>
  </div>

  <script>
    const root = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');

    function applyTheme(theme) {
      if (theme === 'light') {
        root.setAttribute('data-theme', 'light');
        icon.textContent = '☀️';
      } else {
        root.removeAttribute('data-theme');
        icon.textContent = '🌙';
      }
    }

    const saved = localStorage.getItem('theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    const initial = saved || (prefersLight ? 'light' : 'dark');
    applyTheme(initial);

    toggleBtn.addEventListener('click', () => {
      const isLight = root.getAttribute('data-theme') === 'light';
      const next = isLight ? 'dark' : 'light';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
